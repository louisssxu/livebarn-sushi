spring.application.name=Sushi

server.port=${PORT:9000}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

h2.tcp.enabled=${H2_TCP_ENABLED:true}

spring.datasource.url=jdbc:h2:file:./data/sushi
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=always

# Comma-separated frontend origins for browser CORS (set on Railway to your frontend URL)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
